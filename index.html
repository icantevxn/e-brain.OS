<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>e-brain.OS</title>
    <!-- The archive is readable by anyone with the link, which is deliberate.
         Being readable is not the same as wanting to be found — this keeps it
         out of search results. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts loaded here rather than via @import inside the CSS so they
         resolve in parallel with the bundle instead of after it.
         Instrument Serif carries the headlines, Space Mono the data. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
